name: Purge CDN

# Evicts the Cloudflare edge cache after a site deploy actually reaches the
# origin.
#
# Why this exists: the site's static assets (/public/tailwind.css, the brand
# SVGs) are served with `cache-control: public, max-age=14400` at STABLE urls,
# so without a purge Cloudflare keeps serving the previous copy for up to four
# hours after a deploy. That shipped two visible regressions in one day (a
# pre-redesign stylesheet after #1179, then the un-fixed logo marks after
# #1185), each needing a manual dashboard purge somebody had to remember.
#
# Why it waits instead of purging on push: Railway builds take minutes, and
# purging before the new bytes are live would evict the cache while the origin
# still serves the OLD ones, so the next visitor repopulates the edge with
# exactly those, leaving the site stale for another four hours.
#
# Why it asks Railway rather than watching the origin: the first version of
# this workflow inferred the deploy from process uptime, assuming every push to
# main produces one. It does not. Railway marked #1189's own merge commit
# SKIPPED (it touched only .github and a .md), no restart ever happened, and
# the job failed after a 15 minute wait. Inferring the deploy makes every
# docs-only commit a red X, and a job that cries wolf on routine commits is
# worse than no job. So this asks Railway for the deployment matching the
# pushed sha and reads its real status (#1192).
#
# Required secrets:
#   RAILWAY_TOKEN         a Railway PROJECT token for this project's production
#                         environment (narrower than an account token).
#   CLOUDFLARE_API_TOKEN  scoped to Zone / Cache Purge / Purge on the webjs.dev
#                         zone only.
# Both are REPOSITORY secrets: this job declares no `environment:`, so an
# environment-scoped secret would arrive empty. See framework-dev.md.
#
# Manual purge: run this workflow from the Actions tab (workflow_dispatch),
# which skips the deploy wait entirely and purges immediately.

# NOT RUN ON PUSH (#1593). Actions is for publishing only; this runs locally
# as scripts/purge-cdn.sh, which scripts/ci-merge.sh starts in the background
# after every merge and scripts/release.sh runs after a publish. The file
# stays as documentation and can still be dispatched by hand (it then purges
# without waiting for a deploy).
on:
  workflow_dispatch:

# Nothing here reads or writes repo contents (there is no checkout), so the
# job needs no GITHUB_TOKEN scopes at all.
permissions: {}

# A newer push supersedes an older in-flight wait. Never cancel mid-purge: a
# run cancelled after it already purged would report as failed and hide a
# successful eviction.
concurrency:
  group: purge-cdn
  cancel-in-progress: false

jobs:
  purge:
    name: Wait for the deploy, then purge
    runs-on: ubuntu-latest
    # Comfortably above the wait step's own budget, so the step's explanatory
    # exit always happens before the job-level kill (which would leave no
    # diagnosis in the log).
    timeout-minutes: 25
    env:
      # Ids identify resources and are not credentials, so they live in the
      # workflow rather than costing extra secrets.
      ZONE_ID: 46692b879a06f3a6a987b99915560393
      RAILWAY_API: https://backboard.railway.com/graphql/v2
      RAILWAY_PROJECT_ID: 1d05ab75-b64e-4920-94ef-1ca7d04778fc
      RAILWAY_ENVIRONMENT_ID: 2e30b2f6-d166-48d3-9ae7-17176fb0942f
      RAILWAY_SERVICE_ID: 2eb044b7-8698-43d3-959b-37c8925eb653
      # The Railway service domain for @webjsdev/website, used only by the
      # post-purge smoke check so it can compare the edge against the origin.
      ORIGIN: https://webjs.up.railway.app
      # How long to wait for the deployment to reach a terminal status.
      WAIT_BUDGET: 900

    steps:
      - name: Resolve the Railway deployment for this commit
        id: deploy
        if: github.event_name == 'push'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Add it as a REPOSITORY secret"
            echo "(a Railway project token for the production environment)."
            exit 1
          fi

          # Railway's API sits behind Cloudflare, which answers `error code:
          # 1010` to clients whose user agent looks automated (python urllib is
          # blocked outright), so this must go through curl.
          #
          # A project token authenticates with `Project-Access-Token`, an
          # account token with `Authorization: Bearer`. Which one applies
          # depends on the token the owner created, so try both and keep
          # whichever answers without a GraphQL error.
          query='query deployments($input: DeploymentListInput!, $first: Int) { deployments(input: $input, first: $first) { edges { node { id status createdAt meta } } } }'
          payload=$(jq -n --arg q "$query" \
            --arg p "$RAILWAY_PROJECT_ID" --arg e "$RAILWAY_ENVIRONMENT_ID" --arg s "$RAILWAY_SERVICE_ID" \
            '{query: $q, variables: {first: 30, input: {projectId: $p, environmentId: $e, serviceId: $s}}}')

          railway_query() {
            local out
            : > /tmp/railway-last-error
            for hdr in "Project-Access-Token: ${RAILWAY_TOKEN}" "Authorization: Bearer ${RAILWAY_TOKEN}"; do
              out=$(curl -sS --max-time 20 -X POST "$RAILWAY_API" \
                -H "$hdr" -H "Content-Type: application/json" --data "$payload" 2>/dev/null || true)
              # A GraphQL error comes back with HTTP 200 and an `errors` array,
              # so the status code alone proves nothing.
              if [ -n "$out" ] && [ "$(printf '%s' "$out" | jq -r '.errors == null' 2>/dev/null || echo false)" = "true" ]; then
                printf '%s' "$out"
                return 0
              fi
              # Keep the server's own words for the diagnostic below. This is
              # an error body, never the token.
              printf '%s\n' "${out:0:400}" >> /tmp/railway-last-error
            done
            return 1
          }

          started=$(date +%s)
          deadline=$(( started + WAIT_BUDGET ))
          echo "Looking for the Railway deployment of ${SHA} (up to $(( WAIT_BUDGET / 60 ))m)..."

          status=""
          got_response=false
          while [ "$(date +%s)" -lt "$deadline" ]; do
            resp=$(railway_query || true)
            if [ -z "$resp" ]; then
              echo "  Railway API not answering cleanly yet"
            else
              got_response=true
              # A brand new push takes a few seconds to appear, so an empty
              # match keeps polling rather than concluding anything.
              # `meta` may arrive as an object OR as a JSON-encoded string,
              # and this could not be checked against the live API ahead of
              # time. Indexing a string with `.commitHash` is a jq ERROR, not
              # a null, so the unguarded form would swallow every response,
              # poll to the deadline and silently never purge. Normalize both
              # shapes before reading the sha.
              status=$(printf '%s' "$resp" | jq -r --arg sha "$SHA" '
                [ .data.deployments.edges[]?.node
                  | . as $n
                  | ((.meta // {}) | if type == "string" then (fromjson? // {}) else . end) as $m
                  | select(($m.commitHash // "") == $sha)
                  | $n.status ] | first // ""' 2>/dev/null || echo "")
              case "$status" in
                SUCCESS)
                  echo "Deployment SUCCESS: new bytes are live, purge is warranted."
                  echo "should_purge=true" >> "$GITHUB_OUTPUT"
                  exit 0 ;;
                SKIPPED)
                  echo "::notice::Railway SKIPPED this commit, so the origin is unchanged."
                  echo "Nothing is stale at the edge, so there is nothing to purge."
                  echo "should_purge=false" >> "$GITHUB_OUTPUT"
                  exit 0 ;;
                FAILED|CRASHED|REMOVED)
                  echo "::warning::Deployment status ${status}: no new content reached the origin."
                  echo "Skipping the purge, which would only cost a cold cache for no benefit."
                  echo "should_purge=false" >> "$GITHUB_OUTPUT"
                  exit 0 ;;
                "")
                  echo "  no deployment recorded for this sha yet" ;;
                *)
                  echo "  deployment ${status}, still in progress" ;;
              esac
            fi
            sleep 15
          done

          # Never a single clean response means the credential or the endpoint
          # is wrong, not that the deploy is slow. That MUST be loud: a job
          # that quietly stops purging is exactly how the edge goes stale
          # without anyone noticing, which is the bug this workflow exists to
          # prevent.
          if [ "$got_response" != "true" ]; then
            echo "::error::No valid response from the Railway API in $(( WAIT_BUDGET / 60 ))m."
            echo "RAILWAY_TOKEN is likely missing the project, expired, or of the wrong type."
            echo "Last response body from the API:"
            sed 's/^/  /' /tmp/railway-last-error 2>/dev/null | head -10 || true
            exit 1
          fi

          # Dump what the API actually returned. Without this, a field-name or
          # response-shape mismatch is indistinguishable from "the deploy never
          # happened", and the job would quietly stop purging forever while
          # still reporting green.
          if [ -n "${resp:-}" ]; then
            echo "Most recent deployments the API reported for this service:"
            printf '%s' "$resp" | jq -r '
              .data.deployments.edges[]?.node
              | ((.meta // {}) | if type == "string" then (fromjson? // {}) else . end) as $m
              | (($m.commitHash // "") | if . == "" then "<no commitHash>" else .[0:8] end) as $short
              | "  \(.status)  \($short)  \(.createdAt)"' \
              2>/dev/null | head -5 || true
          fi

          # Deliberately not a failure. The whole point of #1192 is that this
          # job must not cry wolf; an unresolved deployment is reported and
          # left for a manual run rather than red-Xing a routine commit.
          echo "::warning::No terminal deployment status for ${SHA} within $(( WAIT_BUDGET / 60 ))m."
          echo "Not purging. If the deploy landed later, run this workflow from the"
          echo "Actions tab to purge manually."
          echo "should_purge=false" >> "$GITHUB_OUTPUT"

      - name: Purge the Cloudflare cache
        if: github.event_name == 'workflow_dispatch' || steps.deploy.outputs.should_purge == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it as a REPOSITORY secret,"
            echo "scoped to Zone / Cache Purge / Purge on the webjs.dev zone."
            exit 1
          fi

          # Zone-wide rather than a file list. Both asset-serving hostnames
          # (webjs.dev, example-blog.webjs.dev) are proxied inside this one
          # zone, so a single call covers them all (docs / ui .webjs.dev sit
          # in the same zone but are redirect rules serving no assets), and a zone purge
          # cannot silently miss an asset the way a hand-maintained path list
          # does. Purging evicts only; nothing is deleted, and the next
          # request refetches from the origin.
          #
          # --fail-with-body matters: a bare curl exits 0 on a 4xx, so without
          # it a rejected purge (bad or expired token) would report success.
          response=$(curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          echo "$response" | jq .
          if [ "$(printf '%s' "$response" | jq -r '.success' 2>/dev/null || echo false)" != "true" ]; then
            echo "::error::Cloudflare rejected the purge."
            exit 1
          fi
          echo "Cache purged for the webjs.dev zone."

      - name: Confirm the edge now matches the origin
        if: github.event_name == 'workflow_dispatch' || steps.deploy.outputs.should_purge == 'true'
        run: |
          set -euo pipefail
          # The purge is asynchronous across pops, so give it a moment before
          # sampling. This is a smoke check on one asset, not a guarantee for
          # every pop, which is why it warns rather than failing the job: the
          # purge itself already succeeded and reported its own status.
          sleep 20

          # tailwind.css is the asset that actually broke in #1179, so it is
          # the one worth sampling.
          etag_of() {
            curl -fsS -I --max-time 10 "$1" 2>/dev/null | tr -d '\r' \
              | awk 'tolower($1)=="etag:"{print $2}' || true
          }
          origin_etag=$(etag_of "$ORIGIN/public/tailwind.css")
          edge_etag=$(etag_of "https://webjs.dev/public/tailwind.css")

          echo "origin etag: ${origin_etag:-<none>}"
          echo "edge etag:   ${edge_etag:-<none>}"

          if [ -z "$origin_etag" ] || [ -z "$edge_etag" ]; then
            # Cloudflare can strip ETags depending on zone settings, so a
            # missing header is inconclusive, NOT proof the edge is correct.
            echo "::warning::Could not compare ETags (one side did not send one)."
            echo "This check is inconclusive; the purge above reported success."
          elif [ "$origin_etag" != "$edge_etag" ]; then
            echo "::warning::Edge and origin ETags still differ for /public/tailwind.css."
            echo "This can be a slow pop rather than a real failure. Re-check with:"
            echo "  curl -sI https://webjs.dev/public/tailwind.css | grep -i 'etag\\|cf-cache-status'"
          else
            echo "Edge matches the origin."
          fi
